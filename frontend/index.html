<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Simples</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }

      .app {
        width: min(90vw, 420px);
        padding: 24px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .controls {
        display: grid;
        gap: 12px;
        margin: 20px 0;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .timer-display {
        margin-top: 18px;
        font-size: clamp(2.6rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .status {
        margin-top: 10px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Timer Simples</h1>
      <p>Defina um tempo e comece a contagem.</p>

      <div class="controls">
        <div class="input-group">
          <label for="minutesInput">Minutos</label>
          <input id="minutesInput" type="number" min="0" max="180" value="25" />
        </div>
        <div class="input-group">
          <label for="secondsInput">Segundos</label>
          <input id="secondsInput" type="number" min="0" max="59" value="0" />
        </div>
      </div>

      <div class="actions">
        <button id="startBtn">Iniciar</button>
        <button id="pauseBtn" disabled>Pausar</button>
        <button id="resetBtn">Resetar</button>
      </div>

      <div id="timerDisplay" class="timer-display">25:00</div>
      <p id="status" class="status">Pronto para começar</p>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
